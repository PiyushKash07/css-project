<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carousel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="carousel">
    <button class="nav prev">&#10094;</button>
    <div class="carousel-track">
        <div class="card active" style="background-image: url('https://picsum.photos/id/1018/600/800');">
            <div class="overlay">
                <h2>Perpetual Planet</h2>
                <button class="learn-more">Learn More</button>
            </div>
        </div>
        <div class="card" style="background-image: url('https://picsum.photos/id/1015/600/800');">
            <div class="overlay">
                <h2>Okavango Wilderness Project</h2>
                <button class="learn-more">Learn More</button>
            </div>
        </div>
        <div class="card" style="background-image: url('https://picsum.photos/id/1020/600/800');">
            <div class="overlay">
                <h2>Pristine Seas</h2>
                <button class="learn-more">Learn More</button>
            </div>
        </div>
        <div class="card" style="background-image: url('https://picsum.photos/id/1020/600/800');">
          <div class="overlay">
              <h2>Pristine Seas</h2>
              <button class="learn-more">Learn More</button>
          </div>
      </div>
    </div>
    <button class="nav next">&#10095;</button>
</div>

<script src="script.js"></script>
</body>
</html>
